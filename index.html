<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Umstell-Labor</title>
<meta name="description" content="Formeln der Elektrotechnik umstellen – Runde für Runde schwerer.">
<meta name="theme-color" content="#0B7A54">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Umstell-Labor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<style>
:root{color-scheme:light; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0; font-size:14px; font-family:system-ui,sans-serif}
img{max-width:100%}
html,body{overscroll-behavior-y:none}
</style>
</head>
<body>
<style>
/* Layout: eine Spalte wie ein Laborpult – Messgeräte-Panels auf Platinen-Raster, Formeln in Lehrbuch-Kursiv */
:root{
  --bg:#E7EEEA; --grid:#CBD9D1; --panel:#F8FBF9; --panel-2:#E0E9E4; --ink:#10211A; --muted:#536A5F; --line:#C1D2C9;
  --acc:#0B7A54; --acc-ink:#FFFFFF; --acc-soft:#D2EEE1;
  --sig:#9A5A00; --sig-soft:#FCEBCB;
  --ok:#137F46; --ok-soft:#DBF2E5; --bad:#BF2F37; --bad-soft:#FBE2E3;
  --f-disp:"Chakra Petch","Avenir Next Condensed",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --f-math:"STIX Two Text","Times New Roman",Times,serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#09130F; --grid:#13241C; --panel:#0F1D17; --panel-2:#16291F; --ink:#E1EEE7; --muted:#8CA698; --line:#22392D;
  --acc:#3BD69B; --acc-ink:#04140D; --acc-soft:#113426;
  --sig:#FFBA42; --sig-soft:#3A2A0B;
  --ok:#47D98C; --ok-soft:#0F3322; --bad:#FF7070; --bad-soft:#3B1618; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#09130F; --grid:#13241C; --panel:#0F1D17; --panel-2:#16291F; --ink:#E1EEE7; --muted:#8CA698; --line:#22392D;
  --acc:#3BD69B; --acc-ink:#04140D; --acc-soft:#113426;
  --sig:#FFBA42; --sig-soft:#3A2A0B;
  --ok:#47D98C; --ok-soft:#0F3322; --bad:#FF7070; --bad-soft:#3B1618; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg); background-image:radial-gradient(var(--grid) 1px, transparent 1.3px); background-size:22px 22px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.45; -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%}
#app{max-width:760px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:14px 40px}
button{font:inherit; color:inherit; touch-action:manipulation; cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sig); outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp); line-height:1.1; margin:0; text-wrap:balance; letter-spacing:.01em}
p{margin:0}
.muted{color:var(--muted)}
.label{font-family:var(--f-disp); font-size:.74rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600}

/* ---------- Mathe-Satz ---------- */
.m{font-family:var(--f-math); white-space:nowrap; font-feature-settings:"lnum"}
.m i{font-style:italic}
.m sup,.m sub{font-size:.62em; line-height:0}
.m sub{font-style:normal}
.op{margin:0 .2em; font-style:normal}
.es{margin:0 .4em}
.pa{font-style:normal}
.fr{display:inline-flex; flex-direction:column; align-items:stretch; vertical-align:middle; margin:0 .1em; text-align:center}
.fr>.fn{border-bottom:.075em solid currentColor; padding:0 .2em .08em}
.fr>.fd{padding:.08em .2em 0}
.fr .fr{font-size:.92em}
.rt{display:inline-flex; align-items:stretch; vertical-align:middle}
.rsv{width:.62em; flex:none; height:auto; overflow:visible}
.rsv path{fill:none; stroke:currentColor; stroke-width:1.4; vector-effect:non-scaling-stroke; stroke-linejoin:round; stroke-linecap:round}
.ri{border-top:.075em solid currentColor; padding:.14em .14em 0 .06em; display:inline-flex; align-items:center}
.mix{display:inline-flex; align-items:center}

/* ---------- Startseite ---------- */
.brand{display:flex; align-items:center; gap:14px; padding-block:10px 4px}
.logo{width:54px; height:54px; flex:none; border-radius:12px; background:var(--acc); color:var(--acc-ink); display:grid; place-items:center}
.brand h1{font-size:clamp(1.9rem, 7vw, 2.6rem); font-weight:700}
.brand p{color:var(--muted); font-size:.95rem}
.meters{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-block:18px}
.meter{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; min-width:0}
.meter b{display:block; font-family:var(--f-disp); font-size:1.5rem; font-variant-numeric:tabular-nums; font-weight:600}
.meter span{font-size:.75rem; color:var(--muted)}
.modes{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
.mode{display:flex; flex-direction:column; gap:6px; text-align:left; padding:14px; border-radius:var(--r); border:1px solid var(--line); background:var(--panel); min-height:132px; transition:transform .12s ease, border-color .12s}
.mode:hover{border-color:var(--acc)}
.mode:active{transform:scale(.98)}
.mode svg{width:30px; height:30px; color:var(--acc)}
.mode h3{font-size:1.15rem; font-weight:600}
.mode p{font-size:.86rem; color:var(--muted); line-height:1.35}
.mode .rec{margin-top:auto; font-family:var(--f-disp); font-size:.78rem; color:var(--sig); font-weight:600; letter-spacing:.03em}
.mode.hero{grid-column:1/-1; background:var(--acc); color:var(--acc-ink); border-color:var(--acc); min-height:0; flex-direction:row; align-items:center; gap:14px}
.mode.hero svg{color:var(--acc-ink); width:40px; height:40px; flex:none}
.mode.hero p,.mode.hero .rec{color:var(--acc-ink); opacity:.85}
.mode.hero .txt{display:flex; flex-direction:column; gap:4px; min-width:0}
.mode.hero h3{font-size:1.4rem}
.mode.frac svg{color:var(--sig)}
.links{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 18px; border-radius:12px; border:1px solid var(--line); background:var(--panel); font-weight:500; min-height:48px}
.btn.pri{background:var(--acc); color:var(--acc-ink); border-color:var(--acc); font-family:var(--f-disp); font-weight:600; letter-spacing:.03em; font-size:1.05rem}
.btn.wide{width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad); border-color:var(--bad)}

/* ---------- Spiel-HUD ---------- */
.hud{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; margin-bottom:10px}
.iconbtn{width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:var(--panel); display:grid; place-items:center; font-size:1.1rem}
.hud-mid{min-width:0}
.hud-mid .t{font-family:var(--f-disp); font-weight:600; font-size:1.05rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pips{display:flex; gap:4px; margin-top:4px}
.pip{height:5px; flex:1; max-width:34px; border-radius:3px; background:var(--panel-2)}
.pip.ok{background:var(--ok)} .pip.bad{background:var(--bad)} .pip.cur{background:var(--sig)}
.hud-r{text-align:right}
.score{font-family:var(--f-disp); font-weight:700; font-size:1.35rem; font-variant-numeric:tabular-nums; line-height:1}
.fuses{display:flex; gap:3px; justify-content:flex-end; margin-top:5px}
.fuse{width:22px; height:12px; color:var(--acc)}
.fuse.blown{color:var(--bad); opacity:.75}
.streak{font-family:var(--f-disp); font-size:.78rem; color:var(--sig); font-weight:600; min-height:1em; letter-spacing:.04em}
.timebar{height:6px; border-radius:3px; background:var(--panel-2); overflow:hidden; margin-bottom:12px}
.timebar i{display:block; height:100%; width:100%; background:var(--acc); transform-origin:left; transition:background .3s}
.timebar.low i{background:var(--bad)}
.timetxt{font-family:var(--f-disp); font-variant-numeric:tabular-nums; font-size:.82rem; color:var(--muted); text-align:right; margin:-8px 0 8px}

.qcard{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px 16px 18px}
.qhead{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:8px}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:.76rem; padding:3px 9px; border-radius:99px; background:var(--panel-2); color:var(--muted); font-weight:500}
.chip.sig{background:var(--sig-soft); color:var(--sig)}
.qtext{font-size:1.02rem; margin-bottom:6px}
.qtext .m{font-size:1.15em}
.formula{font-size:clamp(1.55rem, 6.6vw, 2.3rem); padding-block:14px 6px; overflow-x:auto; overflow-y:hidden; text-align:center; -webkit-overflow-scrolling:touch}
.given{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px}
.given .gv{background:var(--panel-2); border-radius:9px; padding:5px 10px; font-size:1.05rem}
.answer{margin-top:12px}
.opts{display:grid; gap:8px}
@media (min-width:600px){ .opts{grid-template-columns:1fr 1fr} }
.opt{display:flex; align-items:center; gap:12px; text-align:left; padding:10px 14px; min-height:70px; border-radius:12px; border:1.5px solid var(--line); background:var(--panel); font-size:1.35rem; overflow-x:auto}
.opt:hover{border-color:var(--acc)}
.opt .n{font-family:var(--f-disp); font-size:.8rem; color:var(--muted); width:22px; height:22px; flex:none; border-radius:6px; border:1px solid var(--line); display:grid; place-items:center}
.opt.ok{border-color:var(--ok); background:var(--ok-soft)}
.opt.bad{border-color:var(--bad); background:var(--bad-soft)}
.opt.dim{opacity:.45}
.opt[disabled]{cursor:default}
.opt.sym{justify-content:center; font-size:2rem; min-height:64px}
.opts.sym{grid-template-columns:repeat(3,1fr)}

/* Baukasten */
.build{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px}
.bline{display:flex; align-items:center; justify-content:center; gap:6px; font-size:1.6rem; min-height:150px; overflow-x:auto}
.bline .es{margin:0 .25em}
.bfrac{display:inline-flex; flex-direction:column; align-items:stretch; min-width:150px}
.zone{min-height:58px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px; padding:6px; border-radius:10px; border:1.5px dashed var(--line)}
.zone.empty::after{content:attr(data-ph); font-family:var(--f-body); font-size:.8rem; color:var(--muted)}
.bbar{height:2.5px; background:var(--ink); margin:6px 0; border-radius:2px}
.brt{display:inline-flex; align-items:stretch}
.brt .rsv{width:26px}
.brt .rsv path{stroke-width:2.2}
.brt .bin{border-top:2.5px solid var(--ink); padding:8px 4px 2px 6px}
.pool{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; min-height:62px; padding:10px; border-radius:12px; background:var(--panel-2); margin-top:12px}
.tile{font-family:var(--f-math); font-size:1.45rem; min-width:54px; min-height:50px; padding:4px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--panel); box-shadow:0 2px 0 var(--line); display:inline-flex; align-items:center; justify-content:center}
.tile.inz{border-color:var(--acc); background:var(--acc-soft); box-shadow:none}
.tile.ok{border-color:var(--ok); background:var(--ok-soft)}
.tile.bad{border-color:var(--bad); background:var(--bad-soft)}
.bctl{display:grid; grid-template-columns:auto 1fr; gap:8px; margin-top:12px}
.rootbtn{font-family:var(--f-math); font-size:1.3rem; min-width:92px}
.rootbtn[aria-pressed="true"]{background:var(--sig-soft); border-color:var(--sig); color:var(--sig)}
.hint{font-size:.82rem; color:var(--muted); text-align:center; margin-top:8px}

/* Eingabe + Tastenfeld */
.inrow{display:flex; align-items:center; justify-content:center; gap:10px; font-size:1.5rem; padding-block:8px 12px; flex-wrap:wrap}
.field{min-width:120px; min-height:56px; padding:6px 14px; border-radius:12px; border:2px solid var(--line); background:var(--panel); font-family:var(--f-disp); font-size:1.6rem; font-variant-numeric:tabular-nums; display:inline-flex; align-items:center; justify-content:center}
.field.act{border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-soft)}
.field .ph{color:var(--muted); font-size:1rem; font-family:var(--f-body)}
.field.shake{animation:shake .35s}
.ffr{display:inline-flex; flex-direction:column; align-items:stretch; gap:6px}
.ffr .bar{height:3px; background:var(--ink); border-radius:2px}
.unit{font-family:var(--f-math); font-size:1.5rem}
.kp{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.k{min-height:56px; border-radius:12px; border:1px solid var(--line); background:var(--panel); font-family:var(--f-disp); font-size:1.4rem; font-weight:500; box-shadow:0 2px 0 var(--line)}
.k:active{transform:translateY(1px); box-shadow:none}
.k.fn{background:var(--panel-2); font-size:1rem}
.k.go{background:var(--acc); color:var(--acc-ink); border-color:var(--acc); box-shadow:none; font-size:1.1rem; grid-row:span 2}
@media (min-width:600px){ .kp{max-width:420px; margin:0 auto} }

/* Rückmeldung */
.fb{margin-top:12px; border-radius:var(--r); padding:16px; border:1.5px solid var(--line); background:var(--panel)}
.fb.ok{border-color:var(--ok)}
.fb.bad{border-color:var(--bad)}
.fbh{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px}
.fbh h2{font-size:1.35rem}
.fb.ok h2{color:var(--ok)} .fb.bad h2{color:var(--bad)}
.pts{font-family:var(--f-disp); font-weight:700; color:var(--sig); font-size:1.15rem}
.sol{font-size:1.45rem; text-align:center; padding:10px 0; overflow-x:auto}
.note{font-size:.9rem; color:var(--muted); margin-bottom:6px}
.steps{list-style:none; margin:8px 0 14px; padding:0; display:grid; gap:6px; counter-reset:s}
.steps li{display:grid; grid-template-columns:26px 1fr; gap:8px; align-items:start; background:var(--panel-2); border-radius:10px; padding:8px 10px; counter-increment:s; min-width:0}
.steps li::before{content:counter(s); font-family:var(--f-disp); font-size:.8rem; color:var(--muted); width:22px; height:22px; border-radius:6px; border:1px solid var(--line); display:grid; place-items:center}
.steps .sd{font-size:.88rem; color:var(--muted)}
.steps .sd .m{font-size:1.1em; color:var(--ink)}
.steps .se{font-size:1.2rem; overflow-x:auto; padding-block:4px 2px}
.steps .bs{font-size:1.15rem; overflow-x:auto; padding-block:2px}

/* Overlays / Seiten */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:18px}
.center{text-align:center}
.big{font-family:var(--f-disp); font-size:clamp(2.2rem, 10vw, 3.4rem); font-weight:700; line-height:1}
.kv{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-block:14px}
.kv div{background:var(--panel-2); border-radius:10px; padding:10px 6px; text-align:center}
.kv b{display:block; font-family:var(--f-disp); font-size:1.35rem; font-variant-numeric:tabular-nums}
.kv span{font-size:.74rem; color:var(--muted)}
.preview{list-style:none; margin:10px 0 16px; padding:0; display:grid; gap:6px; text-align:left}
.preview li{display:flex; gap:10px; align-items:center; font-size:.95rem; padding:8px 10px; background:var(--panel-2); border-radius:10px}
.preview li::before{content:""; width:8px; height:8px; border-radius:2px; background:var(--sig); flex:none}
.stack{display:grid; gap:10px}
.toplink{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.toplink h2{font-size:1.5rem}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.tg{padding:9px 14px; border-radius:99px; border:1.5px solid var(--line); background:var(--panel); font-size:.92rem; min-height:42px}
.tg[aria-pressed="true"]{background:var(--acc-soft); border-color:var(--acc); color:var(--ink); font-weight:600}
.sec{margin-top:18px}
.sec>.label{display:block; margin-bottom:8px}
.lib{display:grid; gap:8px}
.lib details{background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.lib summary{list-style:none; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer}
.lib summary::-webkit-details-marker{display:none}
.lib summary .nm{font-size:.82rem; color:var(--muted)}
.lib summary .m{font-size:1.25rem; overflow-x:auto; max-width:100%}
.lib summary>div{min-width:0}
.lib .alts{padding:4px 14px 14px; display:grid; gap:6px; border-top:1px solid var(--line); padding-top:10px}
.lib .alts .m{font-size:1.2rem; overflow-x:auto; padding:4px 0}
.lib h3{font-size:1rem; margin-top:10px; color:var(--muted)}
.wronglist{display:grid; gap:6px; margin-top:8px; text-align:left}
.wronglist div{background:var(--panel-2); border-radius:10px; padding:8px 12px; font-size:1.15rem; overflow-x:auto}
.confirm{position:fixed; inset:auto 0 0 0; padding:16px max(16px, env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px)); background:var(--panel); border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; z-index:20; box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.confirm p{flex:1 1 200px; font-weight:500}

.pop{animation:pop .35s ease}
.shake{animation:shake .4s}
@keyframes pop{0%{transform:scale(.96); opacity:.4} 100%{transform:none; opacity:1}}
@keyframes shake{0%,100%{transform:none} 20%{transform:translateX(-7px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
@media (max-width:380px){ .modes{grid-template-columns:1fr} .mode{min-height:0} }
@media (min-width:700px){ body{font-size:17px} .formula{font-size:2.5rem} .opt{font-size:1.5rem} }
</style>

<div id="app"><main id="view"></main></div>
<div id="confirm" class="confirm" hidden></div>

<script>
'use strict';
/* ================= Speicher ================= */
const store={
  get(k,d){ try{ const v=localStorage.getItem('ulab_'+k); return v==null?d:JSON.parse(v) }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem('ulab_'+k, JSON.stringify(v)) }catch(e){} }
};
const ALL_TOPICS=['grund','leist','leit','ac','cl','mag','masch','schalt'];
const TOPICS={grund:'Grundlagen',leist:'Leistung & Energie',leit:'Leitungen & Widerstand',ac:'Wechselstrom',cl:'Kondensator & Spule',mag:'Magnetismus & Feld',masch:'Trafo & Maschinen',schalt:'Schaltungen'};
let settings=Object.assign({topics:ALL_TOPICS.slice(), sound:true}, store.get('settings',{}));
let stats=Object.assign({best:{}, bestScore:{}, solved:0, wrong:0, miss:{}}, store.get('stats',{}));
const saveSettings=()=>store.set('settings',settings);
const saveStats=()=>store.set('stats',stats);

/* ================= Hilfen ================= */
const $=s=>document.querySelector(s);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]} return a};
const gcd=(a,b)=>{a=Math.abs(a); b=Math.abs(b); while(b){[a,b]=[b,a%b]} return a||1};
const lcm=(a,b)=>Math.abs(a*b)/gcd(a,b);

/* ================= Mathe-HTML ================= */
const DOT='<span class="op">·</span>';
const fr=(a,b)=>`<span class="fr"><span class="fn">${a}</span><span class="fd">${b}</span></span>`;
const rt=a=>`<span class="rt"><svg class="rsv" viewBox="0 0 10 20" preserveAspectRatio="none" aria-hidden="true"><path d="M0.6 11.6 L3 10.2 L5.9 19.2 L10 0.6"/></svg><span class="ri">${a}</span></span>`;
const pw=(a,p)=>`${a}<sup>${p}</sup>`;
const o=s=>`<span class="op">${s}</span>`;
const pr=a=>`<span class="pa">(</span>${a}<span class="pa">)</span>`;
const eqH=(l,r)=>`${l}<span class="es">=</span>${r}`;
const M_=h=>`<span class="m">${h}</span>`;
const mul=(...a)=>a.join(DOT);
const pl=(...a)=>a.join(o('+'));
const mi=(...a)=>a.join(o('−'));

const isNum=k=>/^\d+$/.test(k);
const isConst=k=>isNum(k)||!!(V[k]&&V[k].c);
function vh(k){ if(isNum(k)) return k; const v=V[k]; if(v.raw) return v.raw; return `<i>${v.s}</i>`+(v.i?`<sub>${v.i}</sub>`:''); }
function rnd(k){ const v=V[k]; if(v.list) return pick(v.list); const [a,b,s]=v.gen; const n=Math.round((b-a)/s); return +(a+s*ri(0,n)).toPrecision(6); }
function constVal(k){ return isNum(k)? +k : V[k].val; }

/* ---------- Zahlen formatieren ---------- */
const PRE=[[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p']];
function de(n){ let s=String(n); if(/e/.test(s)) s=n.toFixed(12).replace(/0+$/,''); return s.replace('-','−').replace('.',','); }
function sig(v,d){ return +(+v).toPrecision(d); }
function fmtVal(v,k,digits){
  digits=digits||4; const def=V[k]||{};
  if(def.int) return {txt:de(Math.round(v)), mant:Math.round(v), fac:1, pre:'', unit:def.unit||''};
  if(def.np || !def.unit){ const m=sig(v,digits); return {txt:de(m), mant:m, fac:1, pre:'', unit:def.unit||''}; }
  const a=Math.abs(v); let p=PRE[PRE.length-1];
  for(const q of PRE){ if(a>=q[0]*0.9995){ p=q; break; } }
  const m=sig(v/p[0],digits);
  return {txt:de(m), mant:m, fac:p[0], pre:p[1], unit:def.unit};
}
function fmtSci(v){
  const a=Math.abs(v);
  if(a===0) return '0';
  if(a>=0.01 && a<1e5) return de(sig(v,4));
  let e=Math.floor(Math.log10(a)); e=e-((e%3)+3)%3; const m=sig(v/Math.pow(10,e),4);
  return `${de(m)}${DOT}10<sup>${String(e).replace('-','−')}</sup>`;
}
const unitTxt=(f)=>(f.pre+f.unit).trim();

/* ================= Monom-Formeln ================= */
function rank(k){ return isNum(k)?0: isConst(k)?1:2 }
let SUBST=null;
function tokHTML(k,p){
  let base;
  if(SUBST && !isConst(k)) { base=fmtSci(SUBST[k]); if(p>1||/sup|−/.test(base)) base=pr(base); }
  else if(SUBST && k==='mu0') base=pr(fmtSci(V.mu0.val));
  else if(SUBST && k==='eps0') base=pr(fmtSci(V.eps0.val));
  else base=vh(k);
  if(p===1) return base;
  if(!SUBST && (k==='cosphi'||k==='sinphi')) return `${k==='cosphi'?'cos':'sin'}<sup>${p}</sup> <i>φ</i>`;
  return base+`<sup>${p}</sup>`;
}
function groupHTML(map){
  const ks=Object.keys(map).filter(k=>map[k]>1e-9).sort((a,b)=>rank(a)-rank(b));
  let nv=1, nr=1; const items=[], rs=[];
  for(const k of ks){
    const e=map[k], ip=Math.floor(e+1e-9), half=(e-ip)>0.25;
    if(isNum(k)){ nv*=Math.pow(+k,ip); if(half) nr*=+k; continue; }
    if(ip>0) items.push({h:tokHTML(k,ip), pi:k==='pi'});
    if(half) rs.push(tokHTML(k,1));
  }
  const out=[];
  if(nv!==1) out.push({h:String(nv), num:1});
  if(nr!==1 && !rs.length) out.push({h:rt(String(nr))});
  out.push(...items);
  if(rs.length) out.push({h:rt((nr!==1?[String(nr)]:[]).concat(rs).join(DOT))});
  if(!out.length) return '1';
  return out.map((it,i)=> i===0? it.h : ((it.pi && out[i-1].num && !SUBST)?'':DOT)+it.h).join('');
}
function fracOf(map){
  const num={}, den={};
  for(const k in map){ if(map[k]>1e-9) num[k]=map[k]; else if(map[k]<-1e-9) den[k]=-map[k]; }
  const n=groupHTML(num);
  return Object.keys(den).length? fr(n, groupHTML(den)) : n;
}
function displayMap(map){
  const ks=Object.keys(map).filter(k=>Math.abs(map[k])>1e-9);
  const allHalf=ks.length>0 && ks.every(k=>Math.abs(Math.abs(map[k])%1-0.5)<1e-9);
  if(allHalf){ const D={}; ks.forEach(k=>D[k]=map[k]*2); return {D, root:true}; }
  const D={}; ks.forEach(k=>D[k]=map[k]); return {D, root:false};
}
function monoHTML(map){ const {D,root}=displayMap(map); return root? rt(fracOf(D)) : fracOf(D); }
function mkey(map){ return Object.keys(map).filter(k=>Math.abs(map[k])>1e-9).sort().map(k=>k+':'+(+map[k].toFixed(3))).join('|'); }
function solveMono(f,x){
  if(x===f.lhs) return Object.assign({},f.rhs);
  const E={}; E[f.lhs]=1; for(const k in f.rhs) E[k]=(E[k]||0)-f.rhs[k];
  const ex=E[x], res={};
  for(const k in E){ if(k!==x){ const v=-E[k]/ex; if(Math.abs(v)>1e-9) res[k]=v; } }
  return res;
}
function evalMap(map, vals){ let r=1; for(const k in map){ const b=isConst(k)?constVal(k):vals[k]; r*=Math.pow(b,map[k]); } return r; }
function monoWrongs(map){
  const ks=Object.keys(map), out=[], singles=[];
  const add=(m,s)=>{ const c={}; for(const k in m) if(Math.abs(m[k])>1e-9) c[k]=m[k]; if(!Object.keys(c).length) return; (s?singles:out).push(c); };
  ks.forEach(k=>add(Object.assign({},map,{[k]:-map[k]}),1));
  const neg={}; ks.forEach(k=>neg[k]=-map[k]); add(neg);
  const hasHalf=ks.some(k=>Math.abs(map[k]%1)>1e-9);
  if(hasHalf){ const d={}; ks.forEach(k=>d[k]=map[k]*2); add(d,1); ks.forEach(k=>{ if(Math.abs(map[k]%1)>1e-9) add(Object.assign({},map,{[k]:map[k]*2})) }); }
  else {
    const h={}; ks.forEach(k=>h[k]=map[k]/2); add(h);
    ks.forEach(k=>{ if(Math.abs(map[k])===2) add(Object.assign({},map,{[k]:map[k]/2}),1); else if(Math.abs(map[k])===1 && !isConst(k)) add(Object.assign({},map,{[k]:map[k]*2})); });
  }
  ks.filter(isConst).forEach(k=>{ const m=Object.assign({},map); delete m[k]; add(m,1); });
  for(let i=0;i<ks.length;i++) for(let j=i+1;j<ks.length;j++){ add(Object.assign({},map,{[ks[i]]:-map[ks[i]],[ks[j]]:-map[ks[j]]})); }
  const seen=new Set([mkey(map)]); const uniq=a=>a.filter(m=>{ const k=mkey(m); if(seen.has(k)) return false; seen.add(k); return true; });
  return {singles:uniq(shuffle(singles)), others:uniq(shuffle(out))};
}
function eqMaps(L,R){ return eqH(monoHTML(L), monoHTML(R)); }
function monoSteps(f,x){
  let L={[f.lhs]:1}, R=Object.assign({},f.rhs); const st=[];
  let side= (x in L)?'L':'R';
  const xs=()=> side==='L'?L:R;
  const others=Object.keys(xs()).filter(k=>k!==x);
  const groups=[]; const cs=others.filter(isConst); if(cs.length) groups.push(cs); others.filter(k=>!isConst(k)).forEach(k=>groups.push([k]));
  for(const g of groups){
    const pos={}, neg={}; g.forEach(k=>{ const e=xs()[k]; if(e>0) pos[k]=e; else neg[k]=-e; });
    const t=[]; if(Object.keys(pos).length) t.push('÷ '+M_(groupHTML(pos))); if(Object.keys(neg).length) t.push('· '+M_(groupHTML(neg)));
    const es={}; g.forEach(k=>es[k]=xs()[k]);
    for(const k of g){ for(const m of [L,R]){ m[k]=(m[k]||0)-es[k]; if(Math.abs(m[k])<1e-9) delete m[k]; } }
    st.push({t:'Beide Seiten '+t.join(' und '), e:eqMaps(L,R)});
  }
  if(side==='R'){ [L,R]=[R,L]; side='L'; st.push({t:'Seiten tauschen', e:eqMaps(L,R)}); }
  let ex=L[x];
  if(ex<0){ L={[x]:-ex}; const n={}; for(const k in R) n[k]=-R[k]; R=n; ex=-ex; st.push({t:'Kehrwert beider Seiten bilden', e:eqMaps(L,R)}); }
  if(Math.abs(ex-1)>1e-9){ const n={}; for(const k in R) n[k]=R[k]/ex; R=n; L={[x]:1};
    st.push({t: Math.abs(ex-2)<1e-9?'Wurzel ziehen': Math.abs(ex-0.5)<1e-9?'Beide Seiten quadrieren':'Potenzieren', e:eqMaps(L,R)}); }
  return st;
}

function Hw(id,name,topic,tier,lhs,html,sol,gen){ F.push({id,name,topic,tier,lhs,html,sol,gen,mono:0}); }
(()=>{
  const x=vh;
  const Rg=x('Rges'),R1=x('R1'),R2=x('R2'),R3=x('R3'),I1=x('I1'),I2=x('I2'),Ig=x('Iges');
  const g=rnd;
  Hw('reihe','Reihenschaltung','schalt',2,'Rges', eqH(Rg, pl(R1,R2,R3)), {
    R2:{h:mi(Rg,R1,R3), w:[pl(Rg,R1,R3), mi(pl(R1,R3),Rg), pl(mi(Rg,R1),R3), fr(Rg,pl(R1,R3))],
      st:[['Beide Seiten − '+M_(R1)+' − '+M_(R3), eqH(mi(Rg,R1,R3),R2)],['Seiten tauschen',null]], fn:v=>v.Rges-v.R1-v.R3}
  }, ()=>{ const v={R1:g('R1'),R2:g('R2'),R3:g('R3')}; v.Rges=v.R1+v.R2+v.R3; return v; });

  Hw('knoten','Knotenregel','schalt',1,'Iges', eqH(Ig, pl(I1,I2)), {

      st:[['Beide Seiten − '+M_(I1), eqH(mi(Ig,I1),I2)],['Seiten tauschen',null]], fn:v=>v.Iges-v.I1}
  }, ()=>{ const v={I1:g('I1'),I2:g('I2')}; v.Iges=v.I1+v.I2; return v; });

  Hw('parallel','Parallelschaltung zweier Widerstände','schalt',4,'Rges', eqH(Rg, fr(mul(R1,R2),pl(R1,R2))), {
    R1:{h:fr(mul(Rg,R2),mi(R2,Rg)), w:[fr(mul(Rg,R2),mi(Rg,R2)), fr(mi(R2,Rg),mul(Rg,R2)), fr(mul(Rg,R2),pl(Rg,R2)), mi(R2,Rg), fr(pl(Rg,R2),R2)],
      st:[['Beide Seiten · '+M_(pr(pl(R1,R2))), eqH(mul(Rg,pr(pl(R1,R2))), mul(R1,R2))],

function fHTML(f){ return f.mono? eqH(vh(f.lhs), monoHTML(f.rhs)) : f.html; }
function targets(f){ return f.mono? Object.keys(f.rhs).filter(k=>!isConst(k)) : Object.keys(f.sol); }
const PAIRS=[]; F.forEach(f=>targets(f).forEach(x=>PAIRS.push({f,x,key:f.id+':'+x})));
function solHTML(f,x){ return f.mono? monoHTML(solveMono(f,x)) : f.sol[x].h; }
function solSteps(f,x){
  if(f.mono) return monoSteps(f,x);
  return f.sol[x].st.map(([t,e])=>({t, e: e||eqH(vh(x), f.sol[x].h)}));
}

/* ================= Brüche ================= */
class Fr{ constructor(n,d){ d=d===undefined?1:d; if(d<0){n=-n; d=-d;} this.n=n; this.d=d; }
  red(){ const g=gcd(this.n,this.d); return new Fr(this.n/g,this.d/g); }
  eq(o){ return this.n*o.d===o.n*this.d; } isRed(){ return gcd(this.n,this.d)===1; } val(){ return this.n/this.d; } }
const pn=n=>n<0?`(−${-n})`:String(n);
function fh(f,paren){ const n=Math.abs(f.n); let c= f.d===1? String(n) : fr(n,f.d); if(f.n<0) c='−'+c; return (f.n<0&&paren)? pr(c):c; }
function rf(maxD,improper){ for(;;){ const d=ri(2,Math.max(3,maxD)); const n=ri(1, improper? 2*d : d-1); const f=new Fr(n,d).red(); if(f.d>1) return f; } }
function maybeNeg(f,lv,p){ return (lv>=p && Math.random()<0.3)? new Fr(-f.n,f.d) : f; }
function redStep(raw,st){ const r=raw.red(); if(r.d!==raw.d) st.push(`Kürzen mit ${gcd(raw.n,raw.d)}: ${M_(fh(raw)+'<span class="es">=</span>'+fh(r))}`); return r; }
function opSteps(a,b,op,st){
  let raw;
  if(op==='+'||op==='−'){ const s=op==='+'?1:-1;
    if(a.d===b.d){ raw=new Fr(a.n+s*b.n,a.d); st.push(`Gleiche Nenner: Zähler ${op==='+'?'addieren':'subtrahieren'}: ${M_(fh(a)+o(op)+fh(b,1)+'<span class="es">=</span>'+fr(pn(a.n)+' '+op+' '+pn(b.n),a.d)+'<span class="es">=</span>'+fh(raw))}`); }
    else { const k=lcm(a.d,b.d), an=a.n*k/a.d, bn=b.n*k/b.d; raw=new Fr(an+s*bn,k);
      st.push(`Hauptnenner kgV(${a.d}; ${b.d}) = ${k}, beide Brüche erweitern: ${M_(fh(a)+o(op)+fh(b,1)+'<span class="es">=</span>'+fh(new Fr(an,k))+o(op)+fh(new Fr(bn,k),1))}`);
      st.push(`Zähler verrechnen: ${M_(fr(pn(an)+' '+op+' '+pn(bn),k)+'<span class="es">=</span>'+fh(raw))}`); }
  } else if(op==='·'){ raw=new Fr(a.n*b.n,a.d*b.d);
    st.push(`Zähler mal Zähler, Nenner mal Nenner: ${M_(fh(a,1)+o('·')+fh(b,1)+'<span class="es">=</span>'+fr(pn(a.n)+' · '+pn(b.n),a.d+' · '+b.d)+'<span class="es">=</span>'+fh(raw))}`);
  } else { const rb=new Fr(b.d,b.n);
    st.push(`Durch einen Bruch teilen = mit dem Kehrwert malnehmen: ${M_(fh(a,1)+o(':')+fh(b,1)+'<span class="es">=</span>'+fh(a,1)+o('·')+fh(rb,1))}`);
    return opSteps(a,rb,'·',st); }
  return redStep(raw,st);
}
const opC=(a,b,op)=>op==='+'?new Fr(a.n*b.d+b.n*a.d,a.d*b.d).red(): op==='−'?new Fr(a.n*b.d-b.n*a.d,a.d*b.d).red(): op==='·'?new Fr(a.n*b.n,a.d*b.d).red(): new Fr(a.n*b.d,a.d*b.n).red();

/* ================= Modi ================= */
const MODES={
  aufstieg:{name:'Aufstieg', lives:3, per:5, kind:'formel'},
  baukasten:{name:'Baukasten', lives:3, per:5, kind:'formel'},
  rechnen:{name:'Rechnen', lives:3, per:4, kind:'formel'},
  blitz:{name:'Blitz', lives:Infinity, per:Infinity, kind:'formel'},
  brueche:{name:'Brüche', lives:3, per:6, kind:'bruch'},
  training:{name:'Training', lives:Infinity, per:Infinity, kind:'formel'}
};
const tierMax=r=>Math.min(4, 1+Math.floor((r-1)/2));
function nOpts(){ const r=S.round; if(S.mode==='blitz') return Math.min(5,3+Math.floor(S.solved/8)); if(S.mode==='training') return 4; return r<=1?3: r<=4?4: r<=7?5:6; }
function timeLimit(type){
  const r=S.round, m=S.mode;
  if(m==='aufstieg'){ if(r<4) return 0; const base=Math.max(12, 34-(r-4)*3); return 1000*(type==='build'?base+15: type==='calc'?base+50: base); }
  if(m==='baukasten'){ return r<4?0: 1000*Math.max(20, 50-(r-4)*4); }
  if(m==='rechnen'){ return r<5?0: 1000*Math.max(50, 120-(r-5)*10); }
  if(m==='brueche'){ return r<5?0: 1000*Math.max(25, 75-(r-5)*6); }
  return 0;
}

let S=null;
function startGame(mode,opts){
  const Mo=MODES[mode];
  S={mode, M:Mo, round:1, qi:0, lives:Mo.lives, score:0, streak:0, bestStreak:0, roundRes:[], solved:0, total:0, wrongs:[], recent:[], recentF:[], recentT:[], opts:opts||{}, q:null, answered:false, blitzLeft:60000, tStart:0};
  nextQ();
}
function qType(){
  const r=S.round, m=S.mode;
  if(m==='baukasten') return 'build'; if(m==='rechnen') return 'calc'; if(m==='blitz') return 'mc';
  if(m==='training'){ const t=S.opts.type||'mix'; return t!=='mix'? t : pick(['mc','mc','build','calc']); }
  if(r<=2) return 'mc'; if(r<=4) return Math.random()<.7?'mc':'build';
  const x=Math.random(); return x<.5?'mc': x<.8?'build':'calc';
}
function pickPair(type){
  const tmax= S.mode==='training'?4 : S.mode==='blitz'? Math.min(4,1+Math.floor(S.solved/5)) : tierMax(S.round);
  const okT=p=>settings.topics.includes(p.f.topic), okB=p=>type!=='build'||p.f.mono;
  let pool=PAIRS.filter(p=>okT(p)&&okB(p)&&p.f.tier<=tmax);
  if(!pool.length) pool=PAIRS.filter(p=>okT(p)&&okB(p));
  if(!pool.length) pool=PAIRS.filter(okB);
  let fresh=pool.filter(p=>!S.recent.includes(p.key)&&!S.recentF.slice(-2).includes(p.f.id));
  if(!fresh.length) fresh=pool.filter(p=>!S.recent.slice(-3).includes(p.key));
  if(!fresh.length) fresh=pool;
  const w=fresh.map(p=>1+(p.f.tier===tmax?1.3:0)+Math.min(3,stats.miss[p.key]||0)*1.2);
  let t=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<fresh.length;i++){ t-=w[i]; if(t<=0) return fresh[i]; }
  return fresh[fresh.length-1];
}
function makeFormulaQ(){
  const type=qType(); const p=pickPair(type); const {f,x}=p;
  S.recent.push(p.key); if(S.recent.length>12) S.recent.shift(); S.recentF.push(f.id); if(S.recentF.length>4) S.recentF.shift();
  const q={type, f, x, key:p.key, tier:f.tier, fh:fHTML(f), solH:solHTML(f,x), steps:solSteps(f,x)};
  if(type==='mc'){
    const n=nOpts(); let wr;
    if(f.mono){ const {singles,others}=monoWrongs(solveMono(f,x)); const near=S.round>=5||S.solved>15; wr=(near? singles.concat(others) : shuffle(singles.concat(others))).map(monoHTML); }
    else wr=shuffle(f.sol[x].w);
    const opts=[{h:q.solH,ok:true}].concat(wr.slice(0,n-1).map(h=>({h,ok:false})));
    q.opts=shuffle(opts);
  } else if(type==='build'){
    const {D,root}=displayMap(solveMono(f,x)); q.D=D; q.root=root;
    const tiles=Object.keys(D).map((k,i)=>({id:'t'+i,k,a:Math.abs(D[k]),z:'pool'}));
    const nd= S.mode==='baukasten'? (S.round>=6?2: S.round>=3?1:0) : (S.round>=6?1:0);
    if(nd){ const present=new Set([f.lhs].concat(Object.keys(f.rhs)).map(vh)); const cand=shuffle(Object.keys(V).filter(k=>!V[k].c && !present.has(vh(k)))); const used=new Set();
      for(const k of cand){ if(tiles.length>=Object.keys(D).length+nd) break; if(used.has(vh(k))) continue; used.add(vh(k)); tiles.push({id:'d'+k,k,a:1,z:'pool',decoy:1}); } }
    q.tiles=shuffle(tiles); q.useRoot=false;
  } else if(type==='calc'){
    for(let tries=0;tries<30;tries++){
      let vals;
      if(f.mono){ vals={}; const dep=f.dep||f.lhs; const all=[f.lhs].concat(Object.keys(f.rhs)).filter(k=>!isConst(k));
        all.forEach(k=>{ if(k!==dep) vals[k]=rnd(k); }); vals[dep]=evalMap(solveMono(f,dep),vals); }
      else vals=f.gen();
      const keys=f.mono? [f.lhs].concat(Object.keys(f.rhs)).filter(k=>!isConst(k)) : Object.keys(vals);
      const given=[], rv={};
      keys.filter(k=>k!==x).forEach(k=>{ const fv=fmtVal(vals[k],k); rv[k]=fv.mant*fv.fac; given.push({k,fv}); });
      const exp= f.mono? evalMap(solveMono(f,x),rv) : f.sol[x].fn(rv);
      if(!isFinite(exp)||exp<=0) continue;
      const fa=fmtVal(exp,x); q.given=given; q.exp=exp; q.ans=fa; q.rv=rv; break;
    }
    if(!q.ans) return makeFormulaQ();
    let sub='';
    if(f.mono){ SUBST=q.rv; sub=eqH(vh(x), monoHTML(solveMono(f,x))); SUBST=null; }
    q.steps=q.steps.concat([{t:'Werte in Grundeinheiten einsetzen', e:sub||null}, {t:'Ergebnis', e:eqH(vh(x), `${q.ans.txt}&#8239;${unitTxt(q.ans)}`)}].filter(s=>s.e));
    S.kp={fields:['a'], v:{a:''}, act:'a', comma:true};
  }
  return q;
}
function makeFracQ(){
  const lv=S.round; const avail=FT.slice(0, Math.min(FT.length, 1+lv));
  let t; for(let i=0;i<8;i++){ t= Math.random()<.45? avail[avail.length-1] : pick(avail); if(S.recentT.slice(-2).filter(id=>id===t.id).length<2) break; }
  S.recentT.push(t.id); if(S.recentT.length>6) S.recentT.shift();
  const g=t.gen(lv); const q=Object.assign({type:'frac', ft:t, key:'bruch:'+t.id}, g); q.kind=g.kind||'frac';
  if(q.kind==='frac') S.kp={fields:['a','b'], v:{a:'',b:''}, act:'a', comma:false};
  if(q.kind==='dec') S.kp={fields:['a'], v:{a:''}, act:'a', comma:true};
  return q;
}
function nextQ(){
  if(S.mode==='blitz') S.round=1+Math.floor(S.solved/5);
  S.answered=false; S.fb=null;
  S.q= S.M.kind==='bruch'? makeFracQ() : makeFormulaQ();
  renderGame(); startTimer();
}

/* ================= Zeit ================= */
let raf=0;
function startTimer(){
  stopTimer();
  const bar=$('#tb'), tt=$('#tt');
  const lim= S.mode==='blitz'? 0 : timeLimit(S.q.type==='frac'?'frac':S.q.type);
  S.tLimit=lim; S.tStart=performance.now();
  if(S.mode!=='blitz' && !lim){ S.tStart=0; return; }
  const tick=now=>{
    let left, frac;
    if(S.mode==='blitz'){ left=S.blitzLeft-(now-S.tStart); frac=left/60000; }
    else { left=lim-(now-S.tStart); frac=left/lim; }
    if(bar){ bar.firstChild.style.transform=`scaleX(${Math.max(0,Math.min(1,frac))})`; bar.classList.toggle('low', left<5000); }
    if(tt) tt.textContent=Math.max(0,Math.ceil(left/1000))+' s';
    if(left<=0){ onTimeout(); return; }
    raf=requestAnimationFrame(tick);
  };
  raf=requestAnimationFrame(tick);
}
function stopTimer(){
  cancelAnimationFrame(raf);
  if(S && S.tStart){ const el=performance.now()-S.tStart; if(S.mode==='blitz') S.blitzLeft-=el; S.tUsed=el; S.tStart=0; }
}
function onTimeout(){
  if(S.mode==='blitz'){ stopTimer(); S.blitzLeft=0; return gameOver(); }
  onAnswer(false,{timeout:true});
}

let AC=null;
function beep(seq){ if(!settings.sound) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); const t0=AC.currentTime+0.01;
  seq.forEach(([f,d,s])=>{ const os=AC.createOscillator(), g=AC.createGain(); os.type='triangle'; os.frequency.value=f; g.gain.setValueAtTime(0.0001,t0+s); g.gain.exponentialRampToValueAtTime(0.16,t0+s+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t0+s+d); os.connect(g); g.connect(AC.destination); os.start(t0+s); os.stop(t0+s+d+0.03); }); }catch(e){} }
const SND={ok:[[660,.12,0],[990,.18,.08]], bad:[[196,.22,0],[147,.3,.12]], round:[[523,.14,0],[659,.14,.1],[784,.14,.2],[1046,.3,.3]], over:[[392,.2,0],[330,.2,.15],[262,.4,.3]]};

/* ================= Antworten ================= */
function onAnswer(ok, extra){
  if(S.answered) return; S.answered=true; stopTimer(); extra=extra||{};
  const q=S.q; let pts=0; S.total++;
  if(ok){
    S.streak++; S.bestStreak=Math.max(S.bestStreak,S.streak); S.solved++; stats.solved++;
    const base= q.type==='frac'? 100+10*Math.min(S.round,10) : 100+50*(q.tier-1) + (q.type==='build'?40:0) + (q.type==='calc'?80:0);
    const tb= S.tLimit? Math.round(60*Math.max(0,1-(S.tUsed||0)/S.tLimit)) : 0;
    pts=Math.round((base+tb)*(1+Math.min(S.streak-1,10)*0.1)*(extra.half?0.6:1));
    S.score+=pts; if(stats.miss[q.key]) stats.miss[q.key]=Math.max(0,stats.miss[q.key]-0.5);
    if(S.mode==='blitz') S.blitzLeft+=2000;
    beep(SND.ok);
  } else {
    S.streak=0; stats.wrong++; stats.miss[q.key]=(stats.miss[q.key]||0)+1;
    if(isFinite(S.lives)) S.lives--;
    if(S.mode==='blitz') S.blitzLeft=Math.max(0,S.blitzLeft-3000);
    S.wrongs.push(q); beep(SND.bad);
  }
  S.roundRes.push(ok); saveStats();
  S.fb={ok,pts,extra};
  renderGame();
  const fb=$('#fb'); if(fb){ fb.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'nearest'}); }
  if(S.mode==='blitz' && ok) setTimeout(()=>{ if(S && S.answered && S.fb && S.fb.ok) cont(); }, 700);
}
function cont(){
  if(!S) return;
  if(S.mode==='blitz'){ if(S.blitzLeft<=0) return gameOver(); return nextQ(); }
  if(S.lives<=0) return gameOver();
  S.qi++;
  if(S.qi>=S.M.per) return roundEnd();
  nextQ();
}

/* ================= Prüfen ================= */
function checkBuild(){
  const q=S.q; const user={}; const bad=[];
  for(const t of q.tiles){ if(t.z==='pool'){ if(!t.decoy) bad.push(t.id); continue; } if(t.decoy){ bad.push(t.id); continue; } user[t.k]=(user[t.k]||0)+(t.z==='num'?t.a:-t.a); }
  let ok= !bad.length && mkey(user)===mkey(q.D) && q.useRoot===q.root;
  let why='';
  if(!ok){
    if(q.tiles.some(t=>t.z==='pool'&&!t.decoy)) why='Es fehlen noch Bausteine in der Formel.';
    else if(q.tiles.some(t=>t.z!=='pool'&&t.decoy)) why='Ein Baustein gehört gar nicht in diese Formel.';
    else if(q.useRoot!==q.root) why= q.root? 'Die Größe kommt im Quadrat vor – du brauchst die Wurzel.' : 'Hier ist keine Wurzel nötig.';
    else why='Ein oder mehrere Bausteine stehen auf der falschen Seite des Bruchstrichs.';
    q.tiles.forEach(t=>{ if(t.decoy){ if(t.z!=='pool') bad.push(t.id); return; } const want=q.D[t.k]>0?'num':'den'; if(t.z!==want && !bad.includes(t.id)) bad.push(t.id); });
  }
  onAnswer(ok,{bad,why});
}
function parseNum(s){ if(!s||s==='-'||s===',') return NaN; return parseFloat(s.replace(',','.')); }
function checkInput(){
  const q=S.q, kp=S.kp;
  if(q.type==='calc'){
    const u=parseNum(kp.v.a); if(isNaN(u)) return nudge('a');
    const exact=q.exp/q.ans.fac; const ok=Math.abs(u-exact)<=Math.abs(exact)*0.01+1e-12;
    return onAnswer(ok,{val:u});
  }
  if(q.kind==='dec'){ const u=parseNum(kp.v.a); if(isNaN(u)) return nudge('a'); return onAnswer(Math.abs(u-q.a)<1e-9,{}); }
  const n=parseNum(kp.v.a); let d=kp.v.b===''?1:parseNum(kp.v.b);
  if(isNaN(n)) return nudge('a'); if(isNaN(d)||d===0) return nudge('b');
  if(n%1!==0||d%1!==0) return nudge(n%1!==0?'a':'b');
  const u=new Fr(n,d); const a=q.a;
  if(!u.eq(a)) return onAnswer(false,{});
  if(!u.isRed()){ if(q.red) return onAnswer(false,{notRed:1}); return onAnswer(true,{half:1}); }
  onAnswer(true,{});
}
function nudge(f){ const el=$('#f_'+f); if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } S.kp.act=f; refreshInput(); }
function refreshInput(){
  const ans=document.querySelector('.answer'); if(!ans||!S||S.answered) return;
  const q=S.q; ans.innerHTML=inputHTML(q)+keypadHTML();
}
function kpPress(k){
  if(!S||S.answered||!S.kp) return; const kp=S.kp; let v=kp.v[kp.act]||'';
  if(/^\d$/.test(k)){ if(v.replace(/[-.,]/g,'').length<9) v=(v==='0'?'':v.replace(/^-0$/,'-'))+k; }
  else if(k===','){ if(kp.comma && !v.includes(',')) v=(v===''||v==='-')? v+'0,' : v+','; }
  else if(k==='neg'){ v= v.startsWith('-')? v.slice(1) : '-'+v; }
  else if(k==='del'){ v=v.slice(0,-1); if(v===''&&kp.fields.length>1&&kp.act==='b'&&!kp.v.b){ kp.act='a'; } }
  else if(k==='clr'){ kp.fields.forEach(f=>kp.v[f]=''); kp.act=kp.fields[0]; refreshInput(); return; }
  else if(k==='sw'){ if(kp.fields.length>1) kp.act= kp.act==='a'?'b':'a'; refreshInput(); return; }
  else if(k==='ok'){ return checkInput(); }
  kp.v[kp.act]=v; refreshInput();
}

/* ================= Aktionen ================= */
const ACT={
  mode:b=>{ const m=b.dataset.m; if(m==='training') return renderTrainingSetup(); startGame(m); },
  home:()=>renderHome(), settings:()=>renderSettings(), lib:()=>renderLib(),
  topic:b=>{ const t=b.dataset.t; const i=settings.topics.indexOf(t); if(i>=0){ if(settings.topics.length>1) settings.topics.splice(i,1); } else settings.topics.push(t); saveSettings(); b.setAttribute('aria-pressed', settings.topics.includes(t)); },
  sound:b=>{ settings.sound=!settings.sound; saveSettings(); b.setAttribute('aria-pressed',settings.sound); b.textContent='Töne '+(settings.sound?'an':'aus'); if(settings.sound) beep(SND.ok); },
  reset:()=>showConfirm('Gelöste Aufgaben, Rekorde und Fehlerstatistik löschen?', ()=>{ stats={best:{},bestScore:{},solved:0,wrong:0,miss:{}}; saveStats(); renderSettings(); }, 'Löschen'),
  ttype:b=>{ store.set('ttype',b.dataset.t); document.querySelectorAll('[data-act="ttype"]').forEach(x=>x.setAttribute('aria-pressed', x===b)); },
  tstart:()=>startGame('training',{type:store.get('ttype','mix')}),
  opt:b=>{ if(!S||S.answered) return; const i=+b.dataset.i; const q=S.q; const ok= q.type==='frac'? i===q.ok : q.opts[i].ok; onAnswer(ok,{pick:i}); },
  tile:b=>{ if(!S||S.answered) return; const t=S.q.tiles.find(t=>t.id===b.dataset.id); t.z= t.z==='pool'?'num': t.z==='num'?'den':'pool'; document.querySelector('.answer').innerHTML=buildHTML(S.q); },
  root:()=>{ if(!S||S.answered) return; S.q.useRoot=!S.q.useRoot; document.querySelector('.answer').innerHTML=buildHTML(S.q); },
  check:()=>{ if(!S||S.answered) return; checkBuild(); },
  kp:b=>kpPress(b.dataset.k),
  field:b=>{ if(!S||S.answered) return; S.kp.act=b.dataset.f; refreshInput(); },
  next:()=>cont(),
  nextRound:()=>{ S.round++; S.qi=0; S.roundRes=[]; nextQ(); },
  again:()=>startGame(S.mode,S.opts),
  quit:()=>{ if(!S) return renderHome(); if(S.mode==='training') return gameOver(); showConfirm('Spiel beenden? Der Fortschritt dieser Partie geht verloren.', ()=>renderHome(), 'Beenden'); },
  cNo:()=>hideConfirm(),
  cYes:()=>{ const c=$('#confirm'); const y=c._yes; hideConfirm(); if(y) y(); }
};
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act; if(ACT[a]) ACT[a](b); });
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const c=$('#confirm'); if(!c.hidden){ if(e.key==='Escape') hideConfirm(); return; }
  if(e.key==='Enter'){ const nb=$('#nextbtn'); if(nb){ e.preventDefault(); nb.click(); return; } }
  if(!S||S.answered||S.over) return;
  const q=S.q;
  if((q.type==='mc'||(q.type==='frac'&&q.kind==='mc')) && /^[1-6]$/.test(e.key)){ const b=document.querySelector(`[data-act="opt"][data-i="${+e.key-1}"]`); if(b){ e.preventDefault(); b.click(); } return; }
  if(q.type==='build' && e.key==='Enter'){ e.preventDefault(); checkBuild(); return; }
  if(S.kp && (q.type==='calc'||(q.type==='frac'&&q.kind!=='mc'))){
    let k=null; if(/^\d$/.test(e.key)) k=e.key; else if(e.key===','||e.key==='.') k=','; else if(e.key==='-') k='neg'; else if(e.key==='Backspace') k='del'; else if(e.key==='Enter') k='ok'; else if(e.key==='/'||e.key==='Tab') k='sw';
    if(k){ e.preventDefault(); kpPress(k); }
  }
});
renderHome();
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
</body>
</html>
